<form method="post" data-component="publish" action="{{ action }}">
    {% csrf_token %}
    {% if form.author %}
        {% include 'core/_data_protection_notice.html' with purpose=_('delivering responses') %}
        <div class="row">
            <div class="col-lg-9 col-sm-8 col-xs-7">
                {% field form.author %}
            </div>
            <div class="col-lg-3 col-sm-4 col-xs-5">
                {% field form.captcha %}
            </div>
        </div>
    {% endif %}
    {% field form.subject %}
    {% field form.text %}
    <span class="btn has-state has-square-icon has-hover-title is-unresponsive float-right"
          data-state="active">
        <i class="sg sg-xl sg-privacy-private"></i>
        <span class="btn-htitle" data-position="right" title="
        Gespräch wird nicht öffentlich sein.
        {% if view.entity %}
            Benachrichtigungen werden nur an
            {% if view.entity.is_group %}Mitglieder der Gruppe{% endif %}
            @{{ view.entity.slug }} versendet.
        {% endif %}">
        </span>
    </span>
    <button class="btn btn-primary" data-publish-submit>
        Nachricht senden{% if membership_application %} und Mitgliedschaft beantragen{% endif %}
    </button>
</form>
