[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grouprise"
dynamic = ["version"]
description = "Web platform that enables social action and solidarity"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = { paths = ["LICENSE"] }
authors = [
  { name = "grouprise Maintainers", email = "mail@grouprise.org" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Natural Language :: German",
  "Programming Language :: JavaScript",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
]
# Python dependencies of grouprise
#
# Most dependencies below do not use specific version requirements.  In this case you may assume,
# that the package in Debian Bullseye is suitable.
#
# Always synchronize your changes with debian/control, if the module is packaged for Debian:
#    * Build-Depends in source package (first stanza)
#    * Depends in package "grouprise"
#
dependencies = [
  "aiosmtpd",                           # debian: python3-aiosmtpd
  "aiosmtplib",                         # debian: python3-aiosmtplib
  # a problem with `sync_to_async` was fixed in that version
  "asgiref>=3.5.1",                     # debian: python3-asgiref
  "bleach",                             # debian: python3-bleach
  "boltons",                            # debian: python3-boltons
  # Django 3.2 or later is supported
  "django>=3.2",                        # debian: python3-django
  "django-allauth",                     # debian: python3-django-allauth
  # previous versions had an issue with the django-taggit module
  "django-cachalot>=2.4.4",             # debian: python3-django-cachalot
  "django-cors-middleware",             # debian: python3-django-cors-headers
  "django-csp",                         # debian: python3-django-csp
  "django-debug-toolbar",               # debian: python3-django-debug-toolbar
  "django-downloadview",                # debian: python3-django-downloadview
  "django-filter",                      # debian: python3-django-filters
  "django-haystack",                    # debian: python3-django-haystack
  "django-ical",                        # debian: python3-django-ical
  "django-imagekit>=5.0",               # debian: python3-django-imagekit
  "django-ipware",                      # debian: python3-django-ipware
  # OIDC support was introduced in v1.5.0
  # v1.7.0 (part of Debian Bookworm) accidentally introduced a dependency on celery (fixed in v1.7.1)
  "django-oauth-toolkit>=1.5,!=1.7.0",  # debian: python3-django-oauth-toolkit
  "django-taggit>=1.2.0",               # debian: python3-django-taggit
  "djangorestframework",                # debian: python3-djangorestframework
  "feedparser",                         # debian: python3-feedparser
  # The installation of 'gdal' is a bit tricky (see https://pypi.org/project/GDAL/).
  # The following details must be provided outside of the virtual environment:
  #    - `gdal-config` (Debian package `libgdal-dev`)
  #    - Python header files (Debian package `python3-dev`)
  # The gdal Python module must match the version of the system-wide gdal library.
  # The environment variable 'GDAL_VERSION_SPECIFICATION' should be set to
  # something like '==$(gdal-config --version)'.
  # We inject this variable via hatch_grouprise.py (our hatch collector plugin).
  "gdal{env:GDAL_VERSION_SPECIFICATION}",  # debian: python3-gdal
  "html2text",                          # debian: python3-html2text
  "huey",                               # NOT IN DEBIAN
  "kien",                               # NOT IN DEBIAN
  "markdown",                           # debian: python3-markdown
  # TODO: remove specific commit reference after https://github.com/kernc/mdx_unimoji/issues/5
  "mdx_unimoji@git+https://github.com/kernc/mdx_unimoji@f65d87fa",  # NOT IN DEBIAN
  "matrix-nio",                         # debian: python3-matrix-nio
  # used by huey for generic SQL storage
  "peewee",                             # debian: python3-peewee
  "pillow",                             # debian: python3-pil
  "pymdown-extensions",                 # debian (bookworm): python3-pymdownx
  "randomcolor",                        # NOT IN DEBIAN
  "recommonmark",                       # debian: python3-recommonmark
  "ruamel.yaml",                        # debian: python3-ruamel.yaml
  "rules",                              # debian: python3-django-rules
  "schulze",                            # NOT IN DEBIAN
  "sentry-sdk",                         # debian: python3-sentry-sdk
  "setproctitle",                       # debian: python3-setproctitle
  "setuptools",                         # debian: python3-setuptools
  "xapian-bindings-binary",             # debian: python3-xapian
  # xapian-haystack 3.0 erronously did not announce its requirement for django>=3.x
  "xapian-haystack>=3.1",               # debian: python3-xapian-haystack
]

[tool.hatch.version]
path = "grouprise/__init__.py"

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Issues = "https://git.hack-hro.de/grouprise/grouprise/-/issues"
Source = "https://git.hack-hro.de/grouprise/grouprise"

[tool.hatch.envs.default.scripts]
app = "python3 manage.py runserver {args}"
migrate = "python3 manage.py migrate {args}"
collectstatic = "python3 manage.py collectstatic {args:--no-input}"
manage = "python3 manage.py {args}"

[tool.hatch.envs.default]
python = "/usr/bin/python3"
dependencies = [
  "coverage[toml]",
  "httpx",
  "pytest",
]

[tool.hatch.envs.default.env-vars]
GROUPRISE_CONFIG = "grouprise.conf.d"

[tool.hatch.envs.build-install]
dependencies = [
  "hatchling",
]
system-packages = true

[tool.hatch.envs.hatch-test]
default-args = []
# suppress pytest-specific parameters (see https://github.com/pypa/hatch/issues/1822)
randomize = true

[tool.hatch.envs.hatch-test.scripts]
run = "python3 manage.py test {args}"
run-cov = "coverage run -m manage test {args}"

[tool.hatch.envs.hatch-test.env-vars]
GROUPRISE_CONFIG = "grouprise-dev.conf.d"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.11", "3.12"]

[tool.hatch.envs.lint]
dependencies = [
  "mypy",
]

[tool.hatch.env.collectors.custom]
path = "hatch_grouprise.py"

[tool.hatch.envs.lint.scripts]
# TODO: disallow mypy failures
typing = "mypy --install-types --non-interactive {args:grouprise/} || true"

[tool.hatch.envs.hatch-static-analysis]
dependencies = ["black", "flake8", "isort"]

[tool.hatch.envs.hatch-static-analysis.scripts]
format-check = [
  "black --check --diff {args:grouprise}",
  "isort --check-only --diff {args:grouprise}",
]
format-fix = [
  "isort {args:grouprise}",
  "black {args:grouprise}",
]
lint-check = "flake8 {args:grouprise}"
lint-fix = "lint-check"

[tool.coverage.run]
source_pkgs = ["grouprise"]
branch = true
parallel = true

[tool.coverage.paths]
grouprise = ["grouprise"]
tests = ["grouprise/tests", "grouprise/*/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.black]
# Don’t bump to py39, because we’d break support for black shipped with Debian bullseye.
# We may want to revisit that decision if a more recent version of black comes with new formatting rules
# that would produce conflicting code with black shipped in bullseye.
target-version = ["py38"]
# Don’t use extend-exclude: it’s not supported in black shipped with Debian bullseye.
# TODO: Use extend-exclude once we’ve dropped support for black shipped with Debian bullseye.
exclude = '''
    ^/docs/conf\.py$
    | /migrations/[^/]+\.py$
    | ^/build/
    | ^/venv/
'''

[tool.isort]
profile = "black"
